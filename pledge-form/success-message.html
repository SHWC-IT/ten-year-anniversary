<!--
  Pledge form, custom success message.

  Paste this into Elvanto under "After Submission" > "Display a custom
  success message". It renders inside the iframe, on the same navy as the
  modal around it, so the panel simply changes contents when the pledge
  lands. Every style is inline, since none of our stylesheets reach inside
  the Elvanto frame.

  It names no details. Elvanto does NOT run merge fields here, it only does
  that in emails, so a {{first_name}} or {{pledge_amount}} tag renders on
  screen as raw braces. The confirmation email is where the giver sees their
  name and amount echoed back. Do not reintroduce merge tags in this file.

  The button goes straight to the one time Square checkout, the same link
  giving.js opens for a one time gift. It escapes the iframe with
  target="_top", so Square takes over the whole window rather than loading
  inside Elvanto's frame.
-->
<div style="margin:0;padding:22px 8px 26px;background:#0E172B;text-align:center;font-family:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">

  <div style="width:54px;height:54px;margin:0 auto 16px;border-radius:50%;border:1px solid #C9A356;line-height:52px;font-size:24px;color:#ECD29A;">&#10003;</div>

  <p style="margin:0 0 10px;font-size:11px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:#C9A356;">Pledge Received</p>

  <h2 style="margin:0 0 16px;font-family:Cinzel,Georgia,'Times New Roman',serif;font-weight:600;text-transform:uppercase;letter-spacing:.03em;font-size:26px;line-height:1.15;color:#F0ECDF;">Thank you for your pledge.</h2>

  <p style="margin:0 auto 20px;max-width:46ch;font-size:15px;line-height:1.6;color:#A9B2C6;">We have your commitment on record, and a confirmation with the amount you pledged is on its way to your inbox. Give toward it whenever you are ready, in one gift or across the year.</p>

  <a href="https://square.link/u/NKMTbdVA" target="_top" style="display:inline-block;padding:15px 32px;background:#C9A356;color:#0D1322;text-decoration:none;font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;">Give Toward Your Pledge</a>

  <p style="margin:18px 0 0;font-size:13px;line-height:1.6;color:#8C97AE;">Questions? <a href="mailto:finance@theshepherdshouse.church" style="color:#ECD29A;text-decoration:none;">finance@theshepherdshouse.church</a></p>

</div>
